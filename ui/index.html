<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adjustment Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div>
    <h1>Adjustment Review</h1>
    <p class="sub">Manual journal entries, checked for balance, valid accounts and circular intercompany lines.</p>
  </div>
  <div class="top-actions">
    <span id="mode" class="pill">Connecting…</span>
    <button id="rerun" class="btn">Run validation</button>
  </div>
</header>

<main class="layout">
  <section class="ledger" aria-label="Journal entries">
    <div class="summary" id="summary"></div>
    <div class="tabs" role="tablist">
      <button class="tab active" data-filter="all" role="tab">All entries</button>
      <button class="tab" data-filter="QUARANTINED" role="tab">Quarantined</button>
      <button class="tab" data-filter="valid" role="tab">Valid</button>
    </div>
    <div id="entries" class="entries"></div>
  </section>

  <aside class="chat" aria-label="Assistant">
    <div class="chat-head">
      <h2>Ask the validator</h2>
      <p>It reads the results above. It never edits or posts entries.</p>
    </div>
    <div id="log" class="log" aria-live="polite"></div>
    <div class="chips" id="chips">
      <button class="chip">Which entries need human review?</button>
      <button class="chip">Explain the invalid entries</button>
      <button class="chip">Any suspicious intercompany entries?</button>
    </div>
    <div class="composer">
      <textarea id="msg" rows="1" placeholder="Ask about an entry or an error"></textarea>
      <button id="send" class="btn primary">Send</button>
    </div>
  </aside>
</main>
<script src="script.js"></script>
</body>
</html>
